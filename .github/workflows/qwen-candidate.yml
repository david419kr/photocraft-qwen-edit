name: Qwen Windows candidate

on:
  push:
    branches: ['update/0.16.0']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Explicit fork release identity (for example 261028-0.16.0)'
        type: string
        required: true
      source_sha:
        description: 'Exact product source SHA (empty uses the workflow commit)'
        type: string
        default: ''
      windows_only:
        description: 'Build and verify only the Windows package; reuse existing source CI'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qwen-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PHOTOCRAFT_NO_PRINT: "1"
  LPDEST: photocraft-no-such-printer
  PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
  QWEN_UPSTREAM_SHA: b1794c6e0608ccfc887213dcf58398977c5cb75e
  QWEN_BASE_SHA: bf883b3d0f50049faa7b9ca6b5ba540d591350e1

jobs:
  lint:
    name: early Clippy
    if: inputs.windows_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: early-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy across the complete workspace
        run: cargo clippy --workspace --all-targets --locked --features heif -- -D warnings

  regressions:
    needs: lint
    if: inputs.windows_only != true && github.repository == 'david419kr/photocraft-qwen-edit' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/update/0.16.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check candidate ancestry
        run: |
          git merge-base --is-ancestor "$QWEN_UPSTREAM_SHA" HEAD
          git merge-base --is-ancestor "$QWEN_BASE_SHA" HEAD
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: qwen-candidate-linux
      - name: Native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Rust 1.95 Clippy before regressions
        run: cargo clippy --workspace --all-targets --locked --features heif -- -D warnings
      - name: Focused fork regressions (zero tests is an error)
        run: python3 scripts/check-qwen-regressions.py
      - name: Formatting, lint and architecture
        run: |
          cargo fmt --all -- --check
          cargo xtask layers
          cargo xtask wasm
          cargo xtask parity
          cargo xtask scorecard --check
          git diff --exit-code -- docs/parity-checklist.md
      - name: Installer and package verifier tests
        run: |
          python3 -X utf8 qwen-image21-installer/scripts/tests/test_qwen_image21_setup.py -v
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-regressions-${{ github.sha }}
          path: target/qwen-regressions/
          if-no-files-found: error

  windows:
    if: github.repository == 'david419kr/photocraft-qwen-edit' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/update/0.16.0')
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      PHOTOCRAFT_REQUIRE_WINRES: '1'
      PHOTOCRAFT_BUILD_SHA: ${{ inputs.source_sha || github.sha }}
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set explicit package identity without product code changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne $env:PHOTOCRAFT_BUILD_SHA) { throw 'Product source SHA mismatch.' }
          $original = (Get-Content release-tag.txt -Raw).Trim()
          $releaseId = $env:REQUESTED_RELEASE_TAG
          if (!$releaseId) { $releaseId = $original }
          if ($releaseId -notmatch '^\d{6}-(?:(?:[2-9]|[1-9]\d+)-)?\d+\.\d+\.\d+$') { throw 'Invalid explicit release identity.' }
          [IO.File]::WriteAllText((Join-Path $PWD 'release-tag.txt'), "$releaseId`n", [Text.UTF8Encoding]::new($false))
          "PHOTOCRAFT_RELEASE_TAG=$releaseId" | Add-Content $env:GITHUB_ENV
          "PHOTOCRAFT_BUILD_DATE=$([DateTimeOffset]::UtcNow.ToString('yyyy-MM-dd'))" | Add-Content $env:GITHUB_ENV
          New-Item -ItemType Directory -Force dist | Out-Null
          [ordered]@{
            product_source_sha = $source
            original_release_tag = $original
            requested_release_tag = $releaseId
            metadata_override_file = 'release-tag.txt'
            functional_source_unchanged = $true
            controller_sha = '${{ github.sha }}'
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/identity-override.json
          $changed = @(git diff --name-only)
          if (@($changed | Where-Object { $_ -ne 'release-tag.txt' }).Count) { throw 'Unexpected product source changes.' }
      - name: Check candidate ancestry
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:QWEN_UPSTREAM_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Upstream release SHA is not an ancestor.' }
          git merge-base --is-ancestor $env:QWEN_BASE_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Fork base SHA is not an ancestor.' }
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: qwen-candidate-windows-static-crt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse package and installer PowerShell
        shell: pwsh
        run: |
          $files = @(Get-ChildItem scripts/*.ps1) + @(Get-ChildItem qwen-image21-installer/scripts/*.ps1)
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Test Windows executable replacement and rollback
        shell: pwsh
        run: |
          $env:PHOTOCRAFT_TEST_PWSH = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          python -m unittest scripts.tests.test_auto_updater -v
      - name: Build Windows x64 with static CRT and AVIF
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?s)\[workspace\.package\].*?version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:PHOTOCRAFT_RELEASE_TAG -ne (Get-Content release-tag.txt -Raw).Trim()) { throw 'Build and package release identities differ.' }
          if (!$env:PHOTOCRAFT_RELEASE_TAG.EndsWith("-$version")) { throw 'Release tag does not match workspace version.' }
          cargo +1.95.0 build --locked -p photocraft --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath dist/candidate-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate build failed.' }
      - name: Package and verify candidate
        shell: pwsh
        run: ./scripts/build-qwen-candidate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-windows-x64-${{ inputs.source_sha || github.sha }}-${{ inputs.release_tag || 'source-identity' }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/candidate-build.json
            dist/candidate-dependents.txt
            dist/candidate-headers.txt
            dist/candidate-version.txt
            dist/candidate-build.log
            dist/identity-override.json
          if-no-files-found: error
          retention-days: 14
