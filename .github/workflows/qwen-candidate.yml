name: Qwen Windows candidate

on:
  push:
    branches: ['update/0.21.0', 'update/0.20.2', 'update/0.20.1', 'fix/cmyk-adjustment-fill', 'fix/psd-import-20gib']
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Package only; reuse successful gates only for this exact source SHA'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qwen-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PHOTOCRAFT_NO_PRINT: "1"
  LPDEST: photocraft-no-such-printer
  PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
  QWEN_UPSTREAM_SHA: ${{ github.ref == 'refs/heads/build/quick-mask-selected-area-261109' && 'efb7ebd0c0dab1fc108ee4642aa47c22694271a8' || github.ref == 'refs/heads/update/0.20.2' && '7c12f647150f8e7b2e07718f7993b1fcaa57fefe' || '327c4cc82e737a3e0af7c147a477126d77525495' }}
  QWEN_BASE_SHA: ${{ github.ref == 'refs/heads/build/quick-mask-selected-area-261109' && 'f69112e5ae550834899044c8d72eac2083c45947' || github.ref == 'refs/heads/update/0.20.2' && '973eb64ebfb3073851fb9602201645e088c6470f' || github.ref == 'refs/heads/fix/psd-import-20gib' && '06c7aa3073df2be65b7bb06d7293a1e4d30b1d34' || github.ref == 'refs/heads/fix/cmyk-adjustment-fill' && '6ee15434818f1229569b8f650e7316e27a8d827c' || '730a400e7468e5a19f0e5f9cf81142e23ff749c9' }}

jobs:
  lint:
    if: github.repository == 'david419kr/photocraft-qwen-edit' && (github.ref == 'refs/heads/build/quick-mask-selected-area-261109' || github.ref == 'refs/heads/update/0.20.2' || github.ref == 'refs/heads/update/0.20.1' || github.ref == 'refs/heads/fix/cmyk-adjustment-fill' || github.ref == 'refs/heads/fix/psd-import-20gib') && !inputs.build_only
    name: early Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: early-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy across the complete workspace
        run: cargo clippy --workspace --all-targets --locked --features heif -- -D warnings

  regressions:
    needs: lint
    if: github.repository == 'david419kr/photocraft-qwen-edit' && (github.ref == 'refs/heads/build/quick-mask-selected-area-261109' || github.ref == 'refs/heads/update/0.20.2' || github.ref == 'refs/heads/update/0.20.1' || github.ref == 'refs/heads/fix/cmyk-adjustment-fill' || github.ref == 'refs/heads/fix/psd-import-20gib')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check candidate ancestry
        run: |
          git merge-base --is-ancestor "$QWEN_UPSTREAM_SHA" HEAD
          git merge-base --is-ancestor "$QWEN_BASE_SHA" HEAD
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: qwen-candidate-linux
      - name: Native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Rust 1.95 Clippy before regressions
        run: cargo clippy --workspace --all-targets --locked --features heif -- -D warnings
      - name: Focused fork regressions (zero tests is an error)
        run: python3 scripts/check-qwen-regressions.py
      - name: Formatting, lint and architecture
        run: |
          cargo fmt --all -- --check
          cargo xtask layers
          cargo xtask wasm
          cargo xtask parity
          cargo xtask scorecard --check
          git diff --exit-code -- docs/parity-checklist.md
      - name: Installer and package verifier tests
        run: |
          python3 -X utf8 qwen-image21-installer/scripts/tests/test_qwen_image21_setup.py -v
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-regressions-${{ github.sha }}
          path: target/qwen-regressions/
          if-no-files-found: error

  windows:
    if: github.repository == 'david419kr/photocraft-qwen-edit' && (github.ref == 'refs/heads/build/quick-mask-selected-area-261109' || github.ref == 'refs/heads/update/0.20.2' || github.ref == 'refs/heads/update/0.20.1' || github.ref == 'refs/heads/fix/cmyk-adjustment-fill' || github.ref == 'refs/heads/fix/psd-import-20gib')
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      PHOTOCRAFT_REQUIRE_WINRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check candidate ancestry
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:QWEN_UPSTREAM_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Upstream release SHA is not an ancestor.' }
          git merge-base --is-ancestor $env:QWEN_BASE_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Fork base SHA is not an ancestor.' }
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: qwen-candidate-windows-static-crt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse package and installer PowerShell
        shell: pwsh
        run: |
          $files = @(Get-ChildItem scripts/*.ps1) + @(Get-ChildItem qwen-image21-installer/scripts/*.ps1)
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Test Windows executable replacement and rollback
        shell: pwsh
        run: |
          $env:PHOTOCRAFT_TEST_PWSH = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          python -m unittest scripts.tests.test_auto_updater -v
      - name: Build Windows x64 with static CRT and AVIF
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?s)\[workspace\.package\].*?version\s*=\s*"([^"]+)"').Groups[1].Value
          $env:PHOTOCRAFT_RELEASE_TAG = (Get-Content release-tag.txt -Raw).Trim()
          $today = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'Tokyo Standard Time').ToString('yyMMdd')
          if (!$env:PHOTOCRAFT_RELEASE_TAG.StartsWith("$today-")) { throw 'Update the candidate date before building.' }
          if (!$env:PHOTOCRAFT_RELEASE_TAG.EndsWith("-$version")) { throw 'Release tag does not match workspace version.' }
          cargo +1.95.0 build --locked -p photocraft --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath dist/candidate-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate build failed.' }
      - name: Package and verify candidate
        shell: pwsh
        run: ./scripts/build-qwen-candidate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-windows-x64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/candidate-build.json
            dist/candidate-dependents.txt
            dist/candidate-headers.txt
            dist/candidate-version.txt
            dist/candidate-build.log
          if-no-files-found: error
          retention-days: 14
