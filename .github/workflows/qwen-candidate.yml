name: Qwen Windows candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-261014-identity
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PHOTOCRAFT_BUILD_SHA: 970a5c7dc7c086ab8263d6ccb200ab231e106faf
  QWEN_UPSTREAM_SHA: d43db3e153c76aefce9b32cef9099e458eaf17a8
  QWEN_BASE_SHA: b9d8ea92e0e668f010ca1935853a243f52a38ac9

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      PHOTOCRAFT_REQUIRE_WINRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 970a5c7dc7c086ab8263d6ccb200ab231e106faf
      - name: Verify identity-only source change
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:PHOTOCRAFT_BUILD_SHA) { throw 'Wrong source checkout.' }
          $changed = @(git diff --name-only a8b31bac74306b77d42ad7f6c63b0c49ae67c45d HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'release-tag.txt') { throw 'Source differs beyond release identity.' }
          if ((Get-Content release-tag.txt -Raw).Trim() -ne '261014-0.8.2') { throw 'Wrong release identity.' }
      - name: Check candidate ancestry
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:QWEN_UPSTREAM_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Upstream release SHA is not an ancestor.' }
          git merge-base --is-ancestor $env:QWEN_BASE_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Fork base SHA is not an ancestor.' }
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: qwen-candidate-windows-static-crt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse package and installer PowerShell
        shell: pwsh
        run: |
          $files = @(Get-ChildItem scripts/*.ps1) + @(Get-ChildItem qwen-image21-installer/scripts/*.ps1)
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Test Windows executable replacement and rollback
        shell: pwsh
        run: |
          $env:PHOTOCRAFT_TEST_PWSH = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          python -m unittest scripts.tests.test_auto_updater -v
      - name: Build Windows x64 with static CRT and AVIF
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?s)\[workspace\.package\].*?version\s*=\s*"([^"]+)"').Groups[1].Value
          $env:PHOTOCRAFT_RELEASE_TAG = (Get-Content release-tag.txt -Raw).Trim()
          if (!$env:PHOTOCRAFT_RELEASE_TAG.EndsWith("-$version")) { throw 'Release tag does not match workspace version.' }
          cargo +1.95.0 build --locked -p photocraft --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath dist/candidate-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate build failed.' }
      - name: Package and verify candidate
        shell: pwsh
        run: ./scripts/build-qwen-candidate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-windows-x64-970a5c7dc7c086ab8263d6ccb200ab231e106faf
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/candidate-build.json
            dist/candidate-dependents.txt
            dist/candidate-headers.txt
            dist/candidate-version.txt
            dist/candidate-build.log
          if-no-files-found: error
          retention-days: 14
